[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-allocation-optimizer-backend"
version = "0.1.0"
description = "4資産（米国株式・米国債券・米国を除く株式・米国を除く債券）のデータ収集・最適化・バックテストを行う研究用バックエンド"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "PyPortfolioOpt>=1.5",
    "pyarrow>=15",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-python-dateutil>=2.9",
    "pandas-stubs>=2.2",
]

# アプリ（配布パッケージではない）なのでパッケージ化しない
[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
# pydantic v2 の mypy プラグイン利用を前提に、スタブ不足起因のエラーは許容
warn_unused_ignores = false

[tool.coverage.run]
source = ["app"]
